# :schema node_modules/wrangler/config-schema.json
name = "pardeh-negar"
main = "worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Static assets built by Vite
[assets]
directory = "./dist"
binding = "ASSETS"

# Cloudflare Workers KV Namespace binding for Blog Database
[[kv_namespaces]]
binding = "BLOG_KV"
id = "PARDEH_NEGAR_KV_ID"
preview_id = "PARDEH_NEGAR_KV_PREVIEW_ID"

# Environment variables
[vars]
# MODIRIAT_ADMIN can also be added securely via:
# wrangler secret put MODIRIAT_ADMIN
